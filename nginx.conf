server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy only the Odoo /web endpoints the portal needs (session + images).
    # Everything else under /web (backend UI, /web/login, /web/database/manager)
    # must not be reachable through the member portal.
    # TODO: Odoo is reached over plain HTTP on a public IP; switch to HTTPS or a
    # private address so credentials and session cookies are not sent in clear.
    location ~ ^/web/(session/(authenticate|get_session_info|destroy)|image/|content/) {
        proxy_pass http://41.78.157.36:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /web {
        return 404;
    }

    location /api/portal {
        # Investment funding proofs (deposit slips) are sent as base64 JSON: up to 5 files x 10 MB
        client_max_body_size 70m;
        proxy_read_timeout 120s;
        proxy_pass http://41.78.157.36:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /odoo/api {
        rewrite ^/odoo/(.*) /$1 break;
        proxy_pass http://41.78.157.36:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
